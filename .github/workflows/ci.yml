name: Maven CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Start virtual display for JavaFX tests
        run: Xvfb :99 -screen 0 1280x720x24 &

      - name: Build and test
        env:
          DISPLAY: :99
        run: mvn -B clean test
